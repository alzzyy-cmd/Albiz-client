name: build
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [Albiz-PC, Albiz-Mobil]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore binary assets (Sober JAR and older Albiz JAR, SHA-256 verified)
        run: python3 restore_assets.py ${{ matrix.project }}
      - name: Compile and package
        working-directory: ${{ matrix.project }}
        run: |
          set +e
          bash gradlew build -x test --max-workers=2 --console=plain -Dorg.gradle.jvmargs=-Xmx3g > "$RUNNER_TEMP/build.log" 2>&1
          echo "build exit=$?" | tee "$RUNNER_TEMP/status.txt"
          ls -la build/libs 2>/dev/null | tee -a "$RUNNER_TEMP/status.txt"
      - name: Unit tests
        working-directory: ${{ matrix.project }}
        run: |
          set +e
          bash gradlew test --max-workers=2 --console=plain -Dorg.gradle.jvmargs=-Xmx3g > "$RUNNER_TEMP/test.log" 2>&1
          echo "test exit=$?" | tee -a "$RUNNER_TEMP/status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.project }}-jar
          path: ${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: warn
      - name: Publish logs to the branch
        if: always()
        run: |
          d="ci-logs/${{ matrix.project }}"
          mkdir -p "$d"
          cp "$RUNNER_TEMP/status.txt" "$d/status.txt"
          for n in build test; do
            f="$RUNNER_TEMP/$n.log"; [ -f "$f" ] || continue
            grep -n -A3 -E "error:|What went wrong|FAILED|BUILD (SUCCESSFUL|FAILED)|Tests? .*(failed|completed)" "$f" | head -c 300000 > "$d/$n-errors.txt"
            tail -n 150 "$f" > "$d/$n-tail.txt"
          done
          mkdir -p dist
          if [ -f "${{ matrix.project }}/build/libs/albiz-1.0.jar" ]; then
            if [ "${{ matrix.project }}" = "Albiz-Mobil" ]; then
              # Same as tools/package_revision.py does for mobile: drop the desktop ImGui natives.
              python3 - <<'PY'
          import json, zipfile
          src, dst = "Albiz-Mobil/build/libs/albiz-1.0.jar", "dist/Albiz-Mobil.jar"
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  if item.is_dir() or item.filename.startswith("META-INF/jars/imgui-java-natives-"):
                      continue
                  data = zin.read(item.filename)
                  if item.filename == "fabric.mod.json":
                      meta = json.loads(data)
                      meta["jars"] = [j for j in meta.get("jars", []) if "imgui-java-natives-" not in j["file"]]
                      data = (json.dumps(meta, indent=2) + "\n").encode()
                  zout.writestr(item.filename, data)
          PY
            else
              cp "${{ matrix.project }}/build/libs/albiz-1.0.jar" "dist/${{ matrix.project }}.jar"
            fi
            git add dist
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-logs
          git commit -m "CI logs and JAR for ${{ matrix.project }} [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
